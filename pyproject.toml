[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "samwoo-cm-bridge"
version = "0.1.0"
description = "실시간 법령·KCSC 연동 및 HWPX 파싱 기반 CM 3자 교차 검토 FastMCP 엔진"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.3.0",
    "fastmcp>=3.4.1,<4",
    "requests>=2.31.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.2",
    "pypdf>=4.0.0",
    "pdfplumber>=0.11.0",
    "Pillow>=10.0.0",
    "defusedxml>=0.7.1",
    "python-pptx>=0.6.23",
    "tabulate>=0.9.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[project.scripts]
samwoo-cm-bridge = "samwoo_cm_bridge.cli:main"
